name: Deploy NFL Standings

on:
  workflow_dispatch:  # Allow manual trigger
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          cd ${{ secrets.VPS_PROJECT_PATH || '/home/$USER/nfl-standings' }}
          echo "Fetching latest from origin/main..."
          git fetch origin main || true
          echo "Resetting local repo to origin/main..."
          git reset --hard origin/main
          git clean -fd

          echo "Building image..."
          cd ${{ secrets.VPS_PROJECT_PATH || '/home/$USER/nfl-standings' }}
          docker build -t nfl-standings .

          echo "Restarting app container..."
          docker rm -f nfl-standings || true
          mkdir -p data
          docker run -d \
            --name nfl-standings \
            --restart unless-stopped \
            -p 8000:8000 \
            -v "$(pwd)/data:/app/data" \
            -e PYTHONUNBUFFERED=1 \
            -e DATA_DIR=/app/data \
            -e DATABASE_PATH=/app/data/standings.db \
            -e OUTPUT_DIR=/app/data/exports \
            -e PORT=8000 \
            -e REFRESH_INTERVAL_SECONDS=3600 \
            nfl-standings
