version: '3.8'

services:
  nfl-standings:
    build: .
    container_name: nfl-standings
    volumes:
      - ./data:/app/data
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATA_DIR=/app/data
      - DATABASE_PATH=/app/data/standings.db
      - OUTPUT_DIR=/app/data/exports
      - PORT=8000
      - REFRESH_INTERVAL_SECONDS=3600
    restart: unless-stopped
